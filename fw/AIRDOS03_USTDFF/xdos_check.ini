; Kontrola formátu výstupu firmwaru (ust_format_checker).
;
; Sdílený platformio.ini je symlink do TFUNIPAYLOAD01 a popisuje jen hardware desky, proto do
; něj nic AIRDOS-specifického nepatří. Tenhle soubor se k němu přidává jako extra config:
;
;     pio run -c xdos_check.ini -e TFUNIPAYLOAD01_uart -t upload
;
; Až se do sdíleného platformio.ini doplní obecný řádek
;     extra_configs = xdos_*.ini
; načte se tenhle soubor sám a běžné `pio run` bude kontrolu spouštět taky.

[platformio]
extra_configs = platformio.ini

[env]
extra_scripts = post:xdos/hook.py
