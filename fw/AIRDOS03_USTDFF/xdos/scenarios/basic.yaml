# Default scenario. A device without any scenario gets one generated from its board layout,
# the same way this one looks - see default_scenario() in scenario.py.

name: basic
stop_blocks: 4

sensors:
  sht31:
    temp_c: rand(-40, 85)
    humidity: rand(0, 100)

events:
  at: 1.2
  channels: [0, 12, 12, 40, 63, 64, 100, 500, 1023]

gnss:
  fix_at: 1.0
  unix: 1789560000
