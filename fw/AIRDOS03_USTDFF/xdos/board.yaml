# Model desky, jak ji vidí MCU: co je na které I2C adrese a na kterém pinu. Analogová část se
# nesimuluje, model dodává rovnou hodnoty z ADC. Součástky popisuje balíček ust_format_checker
# (components/), tady se jen osazují.

device: AIRDOS03B
mcu: atmega1284
f_cpu: 8000000
millis_symbol: timer0_millis

parts:
  - component: i2c_eeprom
    addr: 0x5B
    note: sériové číslo analogové části, 16 B od offsetu 0x0800
    params:
      offset: "0800"
      data: "00112233445566778899AABBCCDDEEFF"

  - component: i2c_eeprom
    addr: 0x53
    note: konfigurace ADC, 2 B od offsetu 0x0000
    params:
      offset: "0000"
      data: "0A05"

  - component: sht31
    addr: 0x45

  - component: spi_adc_pulse
    pins: {conv: PB0, reset: PC2}

  - component: gnss
    pins: {pps: PD4}
