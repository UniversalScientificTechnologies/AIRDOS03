; Firmware output format check (ust_format_checker).
;
; The shared platformio.ini is a symlink into TFUNIPAYLOAD01 and describes the board hardware
; only, so nothing AIRDOS-specific belongs in it. This file is attached to it as an extra
; config:
;
;     pio run -c xdos_check.ini -e TFUNIPAYLOAD01_uart -t upload
;
; Once the generic line
;     extra_configs = xdos_*.ini
; is added to the shared platformio.ini, this file is picked up on its own and a plain
; `pio run` runs the check as well.

[platformio]
extra_configs = platformio.ini

[env]
extra_scripts = post:xdos/hook.py
