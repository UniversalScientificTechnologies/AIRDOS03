; PlatformIO Project Configuration for BATDATUNIT01C (MightyCore)
; https://github.com/MCUdude/MightyCore/
; Board definition: fw/boards/batdatunit01c.json (8 MHz, UART1, Optiboot 57600)
;
; Default build: [platformio] → airdos04
; Common options: [env]
; Upload firmware: pio run -t upload (uses arduino/Optiboot)
; Set fuses only:  pio run -t fuses -e fuses_bootloader
; Burn bootloader: pio run -t bootloader -e fuses_bootloader

[platformio]
default_envs = airdos03
boards_dir = ../boards
src_dir = .

; Common settings for all environments
[env]
platform = atmelavr
framework = arduino
board = batdatunit01c
platform_packages =
  framework-arduino-avr-mightycore @ 3.0.2
board_build.variant = standard
board_build.f_cpu = 8000000L
lib_deps =
  robtillaart/SHT31@0.5.0
  robtillaart/MS5611@0.4.0
build_flags = -DCHANNELS=0
; Serial upload: Optiboot (arduino), 57600 baud for 8 MHz
upload_protocol = arduino
upload_speed = 57600
monitor_speed = 115200
build_unflags = -flto
build_src_filter = +<*> -<build/>

[env:airdos03]

; PlatformIO calculates fuses and picks bootloader (like Arduino IDE).
; Only set fuses:        pio run -t fuses -e fuses_bootloader --upload-port /dev/ttyUSB0
; Set fuses + burn boot: pio run -t bootloader -e fuses_bootloader --upload-port /dev/ttyUSB0
[env:fuses_bootloader]
board = ATmega1284P
board_build.f_cpu = 8000000L
board_build.variant = standard
board_hardware.oscillator = external
board_bootloader.type = optiboot
board_bootloader.speed = 57600
board_bootloader.file = optiboot_flash/bootloaders/atmega1284p/optiboot_flash_atmega1284p_UART1_57600_8000000L_BIGBOOT.hex
board_hardware.uart = uart1
board_hardware.bod = 2.7v
board_hardware.eesave = yes
upload_protocol = stk500v2

; Alternative: custom script (same result, uses fw/boards/batdatunit01c.json)
[env:bootloader_stk500v2]
upload_protocol = stk500v2
extra_scripts = post:../scripts/upload_bootloader.py
