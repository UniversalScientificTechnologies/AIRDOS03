name: Check output format

# Builds the firmware, runs it in simulation (simavr) and checks that its output still
# conforms to the UST Dosimeters File Format.

# Deliberately kept out of build_fw.yml: that one is invoked through workflow_call when
# releasing, and until the checker package is stable it must not be able to block a release.

on:
  pull_request:
    branches:
      - AIRDOS03B
    paths:
      - 'fw/**'
      - '.github/workflows/xdos_check.yml'
      - '!fw/build/**'
      - '!fw/**/src/githash.h'
      - '!fw/**/nextversion'
  push:
    branches:
      - AIRDOS03B
    paths:
      - 'fw/**'
      - '.github/workflows/xdos_check.yml'
      - '!fw/build/**'
      - '!fw/**/src/githash.h'
      - '!fw/**/nextversion'
  workflow_dispatch:

# run only on the lastest commit
concurrency:
  group: xdos-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: '1'

jobs:
  discover:
    name: Firmware to check
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: set-matrix
        run: |
          MATRIX=$(python3 <<'PY'
          import json, pathlib, yaml

          entries = yaml.safe_load(open("fw/build_matrix.yaml"))
          checked = [e for e in entries
                     if pathlib.Path("fw", e["type"], "xdos", "board.yaml").exists()]
          if not checked:
              raise SystemExit("no firmware has xdos/board.yaml, nothing would be checked")
          print(json.dumps({"include": checked}))
          PY
          )
          echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT
          echo "To be checked: ${MATRIX}"

  check:
    name: ${{ matrix.type }}
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    env:
      PROJECT_DIR: fw/${{ matrix.type }}
      BUILD_DIR: fw/${{ matrix.type }}/.pio/build/${{ matrix.env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.pat }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Simulator
        run: sudo apt-get update && sudo apt-get install -y simavr libsimavr-dev libelf-dev

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles(format('{0}/platformio.ini', env.PROJECT_DIR)) }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install required tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install platformio pytest
          python3 -m pip install -r "${PROJECT_DIR}/xdos/checker.txt"

      - name: Build FW
        run: python3 -m platformio run -d "${PROJECT_DIR}" -e "${{ matrix.env }}"

      - name: Check UST format
        id: check
        run: |
          set -o pipefail
          python3 -m ust_format_checker.platformio --ci \
            "${PROJECT_DIR}" "${BUILD_DIR}" "${BUILD_DIR}/firmware.elf" \
            | tee xdos-report.txt

      - name: Run device specific tests
        if: always() && hashFiles(format('{0}/xdos/tests/test_*.py', env.PROJECT_DIR)) != ''
        run: python3 -m pytest "${PROJECT_DIR}/xdos/tests" -v -ra

      - name: Report into PR summary
        if: always() && hashFiles('xdos-report.txt') != ''
        run: |
          {
            echo "## ${{ matrix.type }}"
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' xdos-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Simulation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xdos-${{ matrix.type }}
          path: |
            ${{ env.BUILD_DIR }}/xdos/capture.txt
            ${{ env.BUILD_DIR }}/xdos/run.scenario
            xdos-report.txt
          retention-days: 14
          if-no-files-found: ignore
