name: Check output format

on:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_COLOR: '1'

jobs:
  discover:
    name: Firmware to check
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: set-matrix
        run: |
          MATRIX=$(python3 <<'PY'
          import json, pathlib, yaml

          entries = yaml.safe_load(open("fw/build_matrix.yaml"))
          checked = [e for e in entries
                     if pathlib.Path("fw", e["type"], "xdos", "board.yaml").exists()]
          if not checked:
              raise SystemExit("no firmware has xdos/board.yaml, nothing would be checked")
          print(json.dumps({"include": checked}))
          PY
          )
          echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT
          echo "To be checked: ${MATRIX}"

  check:
    name: ${{ matrix.type }}
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    env:
      PROJECT_DIR: fw/${{ matrix.type }}
      BUILD_DIR: fw/${{ matrix.type }}/.pio/build/${{ matrix.env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Simulator
        run: sudo apt-get update && sudo apt-get install -y simavr libsimavr-dev libelf-dev

      - name: Install required tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest
          python3 -m pip install -r "${PROJECT_DIR}/xdos/checker.txt"

      # lands where a local build would put it, so the checker and the tests find it on their own
      - name: Firmware built by this run
        uses: actions/download-artifact@v4
        with:
          name: elf_${{ matrix.type }}_${{ matrix.name }}
          path: ${{ env.BUILD_DIR }}

      - name: Check UST format
        run: |
          set -o pipefail
          python3 -m ust_format_checker.platformio --ci \
            "${PROJECT_DIR}" "${BUILD_DIR}" "${BUILD_DIR}/firmware.elf" \
            | tee xdos-findings.txt

      - name: Run device specific tests
        if: always() && hashFiles(format('{0}/xdos/tests/test_*.py', env.PROJECT_DIR)) != ''
        run: |
          set -o pipefail
          python3 -m pytest "${PROJECT_DIR}/xdos/tests" -v -ra | tee xdos-tests.txt

      - name: Compose report
        if: always() && hashFiles('xdos-findings.txt') != ''
        run: |
          python3 .github/scripts/xdos_report.py "${{ matrix.type }}" \
            "${PROJECT_DIR}" "${BUILD_DIR}" xdos-findings.txt xdos-tests.txt > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Report for the release job
        if: always() && hashFiles('report.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: xdos-report-${{ matrix.type }}
          path: report.md
          retention-days: 1

      - name: Simulation output of a failed check
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xdos-debug-${{ matrix.type }}
          path: |
            ${{ env.BUILD_DIR }}/xdos/capture.txt
            ${{ env.BUILD_DIR }}/xdos/run.scenario
            xdos-findings.txt
            xdos-tests.txt
          retention-days: 7
          if-no-files-found: ignore
