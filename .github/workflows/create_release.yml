name: Create Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:
    uses: ./.github/workflows/build_fw.yml
    with:
      build_type: R
    secrets: inherit

  load-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load matrix from file
        id: set-matrix
        run: |
          MATRIX=$(python3 -c "import yaml, json; print(json.dumps({'include': yaml.safe_load(open('fw/build_matrix.yaml'))}))")
          echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT

  release:
    runs-on: ubuntu-latest
    needs: [build, load-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.load-matrix.outputs.matrix) }}
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: fw_${{ matrix.type }}_${{ matrix.name }}
          path: artifact

      - name: Gen release name
        id: gen_release_name
        env:
          FW_NAME: ${{ matrix.name }}
          FW_TYPE: ${{ matrix.type }}
          VERSIONED: ${{ matrix.versioned }}
        run: |
          set -euo pipefail

          NEXTVERSION_PATH="artifact/fw/${FW_TYPE}/nextversion"

          if [ "${VERSIONED}" = "true" ] && [ -f "${NEXTVERSION_PATH}" ]; then
            MAJOR=$(grep '^MAJOR ' "${NEXTVERSION_PATH}" | awk '{print $2}')
            MINOR=$(grep '^MINOR ' "${NEXTVERSION_PATH}" | awk '{print $2}')
            NEXTRELEASE=$(grep '^RELEASE ' "${NEXTVERSION_PATH}" | awk '{print $2}')
            NEXTBUILD=$(grep '^BUILD ' "${NEXTVERSION_PATH}" | awk '{print $2}')

            # nextversion is already incremented by the build job, the firmware
            # that was just built is one build and (for build_type R) one
            # release behind.
            RELEASE=$((NEXTRELEASE - 1))
            BUILD=$((NEXTBUILD - 1))

            VERSION="${MAJOR}.${MINOR}.${RELEASE}-${BUILD}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi

          echo "tagname=${FW_TYPE}-${VERSION}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.gen_release_name.outputs.tagname }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.gen_release_name.outputs.tagname }}
          body: |
            Release of firmware `${{ matrix.type }}` (`${{ matrix.name }}`)

            * version: `${{ steps.gen_release_name.outputs.version }}`
            * PlatformIO env: `${{ matrix.env }}`
            * commit: ${{ github.sha }}
          draft: false
          prerelease: false
          files: artifact/fw/build/fw_${{ matrix.type }}_${{ matrix.name }}.hex
